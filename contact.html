<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Lens2Life Media</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    height:100%;
}

/* BODY LAYOUT */
body{
    font-family:Arial, sans-serif;
    color:white;
    line-height:1.6;

    display:flex;
    flex-direction:column;

    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 40px;
    background:black;
    color:white;

    position:relative;
    z-index:2;
}

nav a{
    color:white;
    margin-left:40px;
    text-decoration:none;
}

/* FIXED BACKGROUND */
.background-wrapper{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
}

.background-image{
    width:100%;
    height:100%;
    object-fit:cover;
}

.background-wrapper::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}

/* MAIN PAGE CONTENT */
main{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:space-evenly;

    padding:40px;
    gap:40px;

    position:relative;
    z-index:2;
}

/* SERVICE ROWS */
.services-row{
    display:grid;
    grid-template-columns:repeat(1, 1fr);
    gap:30px;
}

/* SERVICE CARDS */
.service-card{
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(3px);

    padding:25px;
    border-radius:12px;

    display:flex;
    flex-direction:column;
    justify-content:flex-start;

    min-height:320px;
}

/* TEXT */
h2, h3{
    margin-bottom:15px;
}

p{
    margin-bottom:15px;
}

ul{
    padding-left:20px;
}

li{
    margin-bottom:10px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:black;
    color:white;

    position:relative;
    z-index:2;
}

footer a{
    color:white;
}

/* RESPONSIVE */
@media (max-width:1100px){

.services-row{
    grid-template-columns:repeat(1, 1fr);
}

}

@media (max-width:700px){

.services-row{
    grid-template-columns:1fr;
}

header{
    flex-direction:column;
    gap:15px;
    text-align:center;
}

}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background-wrapper">
    <img src="images/hero.jpg" class="background-image" alt="Background">
</div>

<!-- HEADER -->
<header>
    <h1>Contact Me </h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="services.html">Services</a>
        <a href="About.html">About Me</a>
    </nav>
</header>

<!-- MAIN -->
<main>

<!-- ROW 1 -->
<section class="services-row">

<div class="service-card">
<section id="contact" style="padding:3rem 2rem; text-align:center;">
  <h2>Contact Me</h2>
  <form action="https://formspree.io/f/xvzwkwlp" method="POST" style="max-width:500px;margin:2rem auto;">
    <input type="text" name="name" placeholder="Your Name" required style="width:100%;padding:0.8rem;margin-bottom:1rem;">
    <input type="email" name="_replyto" placeholder="Your Email" required style="width:100%;padding:0.8rem;margin-bottom:1rem;">
    <textarea name="message" placeholder="Your Message" required style="width:100%;padding:0.8rem;margin-bottom:1rem;"></textarea>
    <button type="submit" style="padding:0.8rem 2rem;border:none;border-radius:5px;cursor:pointer;">Send</button>
  </form>
</section>

</div>

</section>
</main>
    <!-- FOOTER -->
<footer>

<p>© 2026 Lens2Life Media</p>

<p>
<a href="https://500px.com/p/lens2lifemedia">Social-500px</a>
</p>

</footer>
</body>
</html>
