<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Your Name Photography</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Your Name Photography</div>
  <nav>
    <a href="index.html">Home</a>
  </nav>
</header>

<section id="contact" style="padding:3rem 2rem; text-align:center;">
  <h2>Contact Me</h2>
  <form action="https://formspree.io/f/your-form-id" method="POST" style="max-width:500px;margin:2rem auto;">
    <input type="text" name="name" placeholder="Your Name" required style="width:100%;padding:0.8rem;margin-bottom:1rem;">
    <input type="email" name="_replyto" placeholder="Your Email" required style="width:100%;padding:0.8rem;margin-bottom:1rem;">
    <textarea name="message" placeholder="Your Message" required style="width:100%;padding:0.8rem;margin-bottom:1rem;"></textarea>
    <button type="submit" style="padding:0.8rem 2rem;border:none;border-radius:5px;cursor:pointer;">Send</button>
  </form>
</section>

</body>
</html>
