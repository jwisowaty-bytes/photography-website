<!DOCTYPE html>

<title>Portfolio - Lens2Life Media</title>
<link rel="stylesheet" href="style.css">
<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    height:100%;
}

/* BODY LAYOUT */
body{
    font-family:Arial, sans-serif;
    color:white;
    line-height:1.6;

    display:flex;
    flex-direction:column;

    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 40px;
    background:black;
    color:white;

    position:relative;
    z-index:2;
}

nav a{
    color:white;
    margin-left:40px;
    text-decoration:none;
}

/* FIXED BACKGROUND */
.background-wrapper{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
}

.background-image{
    width:100%;
    height:100%;
    object-fit:cover;
}

.background-wrapper::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}

/* MAIN PAGE CONTENT */
main{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:space-evenly;

    padding:40px;
    gap:40px;

    position:relative;
    z-index:1;

/* TEXT */
h2, h3{
    margin-bottom:15px;
}

p{
    margin-bottom:15px;
}

ul{
    padding-left:20px;
}

li{
    margin-bottom:10px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:black;
    color:white;

    position:relative;
    z-index:2;
}

footer a{
    color:white;
}

/* RESPONSIVE */
@media (max-width:1100px){

.services-row{
    grid-template-columns:repeat(1, 1fr);
}

}

@media (max-width:700px){

.services-row{
    grid-template-columns:1fr;
}

header{
    flex-direction:column;
    gap:15px;
    text-align:center;
}

}

</style>
 <script>
function openLightbox(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>
 
</head>
